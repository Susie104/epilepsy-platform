<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>癫痫复发预测平台封面</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1600px;height:900px;overflow:hidden}
  body{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;background:#0d0b1d url("../roadshow/assets/neural-background.png") center center / cover no-repeat;color:#fff}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,25,.82) 0%,rgba(8,8,25,.64) 42%,rgba(8,8,25,.18) 100%),linear-gradient(0deg,rgba(7,7,20,.30),transparent 40%)}
  .stripe{position:absolute;left:116px;top:174px;width:74px;height:7px;border-radius:8px;background:#b6ef6b;box-shadow:0 0 24px rgba(182,239,107,.52)}
  .content{position:absolute;left:112px;top:220px;width:1240px}
  .eyebrow{font-size:29px;font-weight:700;letter-spacing:.18em;color:#cbb4ff;text-shadow:0 2px 12px #0b0818}
  h1{margin:39px 0 28px;font-size:108px;line-height:1.12;font-weight:900;letter-spacing:.025em;text-shadow:0 4px 28px rgba(0,0,0,.72)}
  h1 em{font-style:normal;color:#b6ef6b}
  .sub{font-size:36px;font-weight:600;letter-spacing:.03em;color:#f2ecff;text-shadow:0 2px 18px #0b0818}
  .chips{display:flex;gap:17px;margin-top:75px}
  .chip{padding:14px 25px;border:1px solid rgba(225,210,255,.45);border-radius:50px;background:rgba(30,22,57,.68);font-size:24px;font-weight:700;color:#f7f3ff;backdrop-filter:blur(6px)}
  .brand{position:absolute;right:91px;bottom:70px;font-size:28px;font-weight:900;letter-spacing:.12em;color:#f2ebff;text-shadow:0 2px 18px #0b0818}
</style>
</head>
<body>
<div class="shade"></div>
<div class="stripe"></div>
<main class="content">
  <div class="eyebrow">癫痫研究 · 风险预测</div>
  <h1>癫痫复发<br><em>预测平台</em></h1>
  <div class="sub">面向研究的预测与数据审核演示平台</div>
  <div class="chips"><span class="chip">风险预测</span><span class="chip">数据审核</span><span class="chip">逆向情景</span></div>
</main>
<div class="brand">三合医</div>
</body>
</html>
