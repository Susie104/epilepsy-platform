,"source_ids":["BEHGI2010","GALOVIC2021"]}},{"entity_id":"concept_pse_def_03","entity_type":"DefinitionConcept","canonical_name_zh":"晚期无诱因发作","canonical_name_en":"PSE-DEF-03","definition":"卒中7天后发生的首次临床确认无诱因发作属于晚期/远期症状性发作。其后续无诱因发作风险高，单个事件在卒中背景下可具有癫痫诊断意义。","aliases_zh":["晚期发作","晚期无诱因发作","远期症状性发作"],"aliases_en":["late seizure","late unprovoked seizure","remote symptomatic seizure"],"abbreviations":[],"non_synonyms":["acute symptomatic seizure"],"status":"provisional","properties":{"project_action":"作为主要PSE事件的核心定义；要求临床确认并保留证据。","population":"卒中后患者，尤其是存在远端结构性病灶者","limitations":"需要排除急性症状性、心因性非癫痫发作、晕厥、代谢性发作和仅有不确定症状。","strict_endpoint":"include","evidence_status":"研究综述支持","source_ids":["GALOVIC2021","FISHER2014"]}},{"entity_id":"concept_pse_def_04","entity_type":"DefinitionConcept","canonical_name_zh":"ILAE 2014癫痫定义","canonical_name_en":"PSE-DEF-04","definition":"满足任一条件可诊断为癫痫：①≥2次无诱因或反射性发作，间隔>24小时；②1次无诱因发作且未来10年再发风险至少60%；③诊断为癫痫综合征。","aliases_zh":["2014癫痫临床定义","ILAE 2014癫痫定义"],"aliases_en":["ILAE 2014 epilepsy definition","practical clinical definition of epilepsy"],"abbreviations":[],"non_synonyms":["single early seizure"],"status":"provisional","properties":{"project_action":"用于解释单个晚期无诱因卒中后发作为何可具有癫痫诊断意义。","population":"全年龄；本课题仅在成人缺血性卒中范围应用","limitations":"第2条需要可靠的复发风险依据；不能对每一次卒中后发作机械套用60%。","strict_endpoint":"definition_support","evidence_status":"ILAE官方定义","source_ids":["FISHER2014"]}},{"entity_id":"concept_pse_def_05","entity_type":"DefinitionConcept","canonical_name_zh":"本项目建议的PSE主结局","canonical_name_en":"PSE-DEF-05","definition":"卒中起病或预先确定的索引时点后>7天，首次经临床确认的无诱因癫痫发作；排除既往癫痫和急性症状性发作；事件日期必须可追溯。","aliases_zh":["建议PSE主结局","本项目PSE主结局"],"aliases_en":["proposed primary PSE endpoint"],"abbreviations":[],"non_synonyms":["D13 second_epilepsy label"],"status":"provisional","properties":{"project_action":"主分析使用“首次PSE事件时间”；未能确认日期或性质者进入unknown/待审核，不强行转为阴性。","population":"成人、新发缺血性卒中，纳入和排除标准由团队冻结","limitations":"预测起点目前仍需老师在“卒中发病日”和“出院日”之间确认；不同起点不可混用。","strict_endpoint":"proposed_primary","evidence_status":"项目综合建议，待临床审核","source_ids":["FISHER2014","GALOVIC2021","PROJECTBOUNDARY"]}},{"entity_id":"concept_pse_def_06","entity_type":"DefinitionConcept","canonical_name_zh":"局灶保留意识发作（旧称单纯部分性发作）","canonical_name_en":"PSE-DEF-06","definition":"ILAE 2017以“focal aware”替代旧术语simple partial。它是可观察的局灶性临床发作；若主结局定义为“任何临床确认的无诱因癫痫发作”，原则上应计入。","aliases_zh":["单纯部分性发作","局灶保留意识发作"],"aliases_en":["focal aware seizure","simple partial seizure"],"abbreviations":[],"non_synonyms":["absence seizure"],"status":"provisional","properties":{"project_action":"单独保留aware/impaired-awareness字段；不能因没有意识丧失而自动排除。","population":"癫痫患者通用分类；本课题用于卒中后发作表型","limitations":"若研究只关注严重发作或意识受损发作，必须作为预先规定的次要结局，不可无声排除。","strict_endpoint":"include_if_clinical_event","evidence_status":"ILAE分类","source_ids":["FISHER2017"]}},{"entity_id":"concept_pse_def_07","entity_type":"DefinitionConcept","canonical_name_zh":"仅有电图异常或电图发作","canonical_name_en":"PSE-DEF-07","definition":"间期癫痫样放电不是癫痫发作。仅有电图演变而无临床可见症状可以构成电图发作，但不能自动等同于临床复发性PSE事件。","aliases_zh":["亚临床电图发作","仅有电图发作","电图发作"],"aliases_en":["electrographic seizure","electrographic-only seizure","subclinical electrographic seizure"],"abbreviations":[],"non_synonyms":["interictal epileptiform discharge","IEED"],"status":"provisional","properties":{"project_action":"主结局优先采用临床确认发作；另设“包含电图发作”的敏感性结局并明确EEG判读标准。","population":"接受EEG监测的卒中患者，尤其重症或意识障碍患者","limitations":"临床观察可能漏诊非惊厥发作；若纳入电图发作，结局定义和模型适用人群会改变。","strict_endpoint":"conditional_separate_sensitivity","evidence_status":"研究与综述支持，具体纳入方式需预先定义","source_ids":["GALOVIC2021","FISHER2017"]}},{"entity_id":"concept_pse_def_08","entity_type":"DefinitionConcept","canonical_name_zh":"死亡","canonical_name_en":"PSE-DEF-08","definition":"死亡不是“未发生癫痫”的证据。若死亡发生在首次PSE事件前，应作为竞争事件；若癫痫已发生后再死亡，该事件仍应保留。","aliases_zh":["死亡","死亡事件"],"aliases_en":["death","mortality"],"abbreviations":[],"non_synonyms":["no seizure"],"status":"provisional","properties":{"project_action":"记录死亡日期和事件日期；同一日先后不明时进入敏感性分析。","population":"所有进入时间结局分析的患者","limitations":"这是研究终点实现规则，不是ILAE诊断标准；二分类D13数据无法执行竞争风险。","strict_endpoint":"competing_event","evidence_status":"项目研究规范","source_ids":["PROJECTBOUNDARY"]}},{"entity_id":"concept_pse_def_09","entity_type":"DefinitionConcept","canonical_name_zh":"失访、随访不足与窗口不确定","canonical_name_en":"PSE-DEF-09","definition":"最后一次可靠无复发评估早于窗口终点时，应删失或标为unknown，不能自动记作0。若事件日期区间跨越窗口终点，结局待定。","aliases_zh":["失访","窗口不确定","随访不足"],"aliases_en":["indeterminate window","insufficient follow-up","loss to follow-up"],"abbreviations":["LTFU"],"non_synonyms":["confirmed negative"],"status":"provisional","properties":{"project_action":"记录last_reliable_followup_date、事件上下界和失访原因；固定窗口二分类仅在可靠覆盖完整窗口时使用。","population":"所有固定时间窗研究者","limitations":"D13没有患者ID、事件日期和随访截止日期，因此无法恢复这些状态。","strict_endpoint":"censor_or_unknown_not_negative","evidence_status":"项目研究规范","source_ids":["PROJECTBOUNDARY","D13PAPER"]}},{"entity_id":"concept_pse_def_10","entity_type":"DefinitionConcept","canonical_name_zh":"D13 `second_epilepsy` 的可用范围","canonical_name_en":"PSE-DEF-10","definition":"D13只提供一年内继发性癫痫的0/1标签，不能确认其是否严格满足“>7天、首次、临床确认、无诱因”以及死亡/随访处理要求。","aliases_zh":["D13结局标签","second_epilepsy标签","一年继发性癫痫0/1标签"],"aliases_en":["D13 binary PSE label","D13 second_epilepsy label"],"abbreviations":[],"non_synonyms":["strict clinical PSE endpoint"],"status":"provisional","properties":{"project_action":"仅用于一年二分类方法演示；不能将标签改写为严格的首次远期无诱因PSE，不能做Fine-Gray。","population":"D13公开数据：21,459名成人缺血性或缺隙性卒中患者","limitations":"无患者ID、事件日期、死亡日期和最后可靠随访日期。","strict_endpoint":"not_sufficient","evidence_status":"数据审计事实","source_ids":["D13PAPER","PROJECTBOUNDARY"]}},{"entity_id":"population_select_ischemic_stroke","entity_type":"Population","canonical_name_zh":"成人影像确认的缺血性卒中人群","canonical_name_en":"Adults with imaging-confirmed ischemic stroke","definition":"SeLECT主要适用的成人缺血性卒中人群；多数研究排除既往癫痫、出血性卒中和TIA。","aliases_zh":[],"aliases_en":[],"abbreviations":[],"non_synonyms":[],"status":"verified","properties":{"inclusion_summary":"成人首次影像确认缺血性卒中","source_ids":["GALOVIC2018","SINKA2023"]}},{"entity_id "status":"verified","properties":{"domain":"early_poststroke_event","time_window":"卒中后0-7天","source_ids":["SINKA2023"]}},{"entity_id":"concept_select_cortical_involvement","entity_type":"ClinicalConcept","canonical_name_zh":"皮质受累","canonical_name_en":"Cortical involvement","definition":"影像显示梗死累及大脑皮质。","aliases_zh":["皮质受累","皮质梗死"],"aliases_en":["cortical infarction","cortical involvement"],"abbreviations":[],"non_synonyms":["皮质下受累"],"status":"verified","properties":{"domain":"stroke_imaging","source_ids":["GALOVIC2018","SINKA2023"]}},{"entity_id":"concept_select_mca_territory","entity_type":"ClinicalConcept","canonical_name_zh":"大脑中动脉供血区梗死","canonical_name_en":"Infarction in MCA territory","definition":"影像确认的梗死位于大脑中动脉供血区，不是单纯的MCA狭窄或闭塞。","aliases_zh":["MCA供血区梗死","大脑中动脉供血区梗死"],"aliases_en":["MCA territory infarction","infarction in MCA territory"],"abbreviations":["MCA territory"],"non_synonyms":["MCA狭窄","MCA闭塞"],"status":"verified","properties":{"domain":"stroke_imaging","source_ids":["GALOVIC2018","SINKA2023"]}},{"entity_id":"concept_select_post_treatment_nihss","entity_type":"ClinicalConcept","canonical_name_zh":"治疗后72小时NIHSS","canonical_name_en":"72-hour post-treatment NIHSS","definition":"再灌注治疗后72小时测量的NIHSS，用于修改版SeLECT 2.0评估。","aliases_zh":["72小时NIHSS","治疗后72小时NIHSS"],"aliases_en":["72-hour post-treatment NIHSS","post-treatment NIHSS"],"abbreviations":["PT-NIHSS"],"non_synonyms":["入院NIHSS"],"status":"verified","properties":{"domain":"stroke_clinical_measurement","source_ids":["MELETTI2024"]}},{"entity_id":"concept_select_eeg_epileptiform","entity_type":"ClinicalConcept","canonical_name_zh":"早期EEG癫痫样活动","canonical_name_en":"Early EEG epileptiform activity","definition":"卒中后7天内EEG显示的癫痫样活动，是SeLECT-EEG的附加标志。","aliases_zh":["EEG癫痫样活动","早期EEG癫痫样活动"],"aliases_en":["EEG epileptiform activity","early EEG epileptiform activity"],"abbreviations":["EEG-EA"],"non_synonyms":["电图发作"],"status":"verified","properties":{"domain":"eeg_measurement","source_ids":["SCHUBERT2025_EEG"]}} 录大血管动脉粥样硬化，不等同于TOAST定义的大动脉粥样硬化病因。"},{"node":"field_mca","title":"MCA狭窄或闭塞不等于供血区梗死","text":"D13的mca来自CTA、MRA或DSA记录；SeLECT需要的是影像上梗死是否位于MCA供血区。"},{"node":"outcome_second_epilepsy","title":"结局标签不是严格时间终点","text":"second_epilepsy是一年内继发性癫痫0/1标签，公开材料没有完整说明7天分界、发作类型和临床裁决。"},{"node":"model_select_2_0","title":"因此只能做部分变量对照","text":"D13可以演示风险模型流程，但不能计算正式SeLECT或2.0评分，也不能称为SeLECT外部验证。"}]},{"id":"early-late","number":"04","title":"早期发作与晚期无诱因发作","subtitle":"7天分界、临床可见性、电图异常三个容易混淆的概念","steps":[{"node":"concept_pse_def_01","title":"急性症状性发作","text":"卒中后7天内的临床发作通常作为卒中急性损伤相关事件处理，不等同于卒中后癫痫。"},{"node":"concept_pse_def_02","title":"第7天仍是早期","text":"目前约定≤7天为早期，>7天为晚期。研究方案必须把这个边界固定下来。"},{"node":"concept_pse_def_03","title":"晚期发作才可能进入癫痫结局","text":"卒中7天后首次临床确认的无诱因发作才更接近SeLECT的预测目标。"},{"node":"concept_pse_def_05","title":"项目建议主结局","text":"索引后超过7天、首次临床确认的无诱因发作，排除既往癫痫和急性症状性发作，并保留可追溯事件日期。"},{"node":"concept_pse_def_06","title":"局灶保留意识发作","text":"现代术语为focal aware seizure。若主结局是任何临床确认的无诱因发作，原则上应纳入。"},{"node":"concept_pse_def_07","title":"仅有电图发作","text":"间期癫痫样放电不是发作；仅有电图演变是否计入主结局，需要临床老师预先裁决。"}]},{"id":"competing-risk","number":"05","title":"死亡竞争风险需要哪些数据","subtitle":"没有癫痫时间、死亡时间和最后可靠随访，就不能完成Fine-Gray","steps":[{"node":"outcome_late_unprovoked_seizure","title":"主结局必须有发生时间","text":"累计发生函数不仅需要是否发生，还需要首次事件日期和随访起点。"},{"node":"concept_pse_def_08","title":"死亡不是无癫痫","text":"首次癫痫前死亡应进入竞争事件；癫痫后再死亡时，癫痫事件仍然保留。"},{"node":"concept_pse_def_09","title":"失访不能直接记成阴性","text":"最后可靠随访早于一年终点时应保留删失或结局未确定状态。"},{"node":"issue_d13_no_patient_id","title":"D13恰好缺少这些时间字段","text":"没有患者ID、癫痫日期、死亡日期和末次可靠随访，因此无法完成时间到事件或竞争风险分析。"},{"node":"population_d13","title":"筛选人群还会改变解释","text":"D13已排除住院死亡、早期死亡和失访患者，所以4.36%不能代表全部卒中患者死亡竞争下的累积风险。"},{"node":"field_second_epilepsy","title":"0/1字段无法补救","text":"只能把这个字段作为一年内二分类代理标签，不能反推出个体事件日期。"}]}],"d13_mapping":[{"select_variable":"NIHSS at admission","points":"0/1/2","d13_field":"nihss","mapping":"exact_concept","derivable":true,"distribution":"≤3：423；4-10：17249；≥11：3787","limitation":"D13以中度卒中为主，而SeLEC
